syntax = "proto3";

package adapter;

enum ErrType {
    ERROR_TYPE_UNSPECIFIED = 0;
    ERROR_TYPE_OK = 1;
    ERROR_TYPE_BAD_REQUEST = 2;
    ERROR_TYPE_BAD_STATE = 3;
    ERROR_TYPE_FLASH = 4;
    ERROR_TYPE_IMAGE_HEADER = 5;
    ERROR_TYPE_IMAGE_CRC = 6;
}

message ErrorResponse {
    ErrType err_type = 1;
}

message VersionRequest {
}

message VersionResponse {
    string version = 1;
    string git_commit = 2;
    string git_branch = 3;
    string build_date = 4;
    bool dirty = 5;
    uint32 target = 6;
}

message UpdateBeginRequest {
    uint32 size = 1;
    uint32 crc32 = 2;
}

message UpdateWriteRequest {
    uint32 offset = 1;
    bytes data = 2;
}

message UpdateFinishRequest {
}

message RpcRequest {
    uint32 request_id = 1;

    oneof payload {
        VersionRequest version = 2;
        UpdateBeginRequest update_begin = 3;
        UpdateWriteRequest update_write = 4;
        UpdateFinishRequest update_finish = 5;
    }
}

message RpcResponse {
    uint32 request_id = 1;

    oneof payload {
        VersionResponse version = 2;
        ErrorResponse generic = 3;
    }
}
